        name: "autumn-dates"
        type: string

      - label: "Catégories du Menu d'Automne (Illimité)"
        name: "autumn_categories"
        type: list
        fields:
          - label: "Nom de la Catégorie (ex: Les Entrées de Saison)"
            name: "category_title"
            type: string
          - label: "Liste des Plats"
            name: "items"
            type: list
            fields:
              - label: "Nom du plat"
                name: "name"
                type: string
