          type: string
        - label: "Notes / Étoiles (ex: ★★★★★ ou 9.6/10)"
          name: "stars"
          type: string
        - label: "Commentaire / Texte de l'avis"
          name: "text"
          type: text
        - label: "Auteur (ex: — Thomas V.)"
          name: "author"
